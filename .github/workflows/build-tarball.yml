# Builds CloudCLI as a self-contained Linux x64 tarball (no Docker, no
# install needed on the target host). Intended for small Aliyun ECS
# instances that can't run `npm install` without IO starving.
#
# Output:
#   - GitHub Actions artifact (90 days)
#   - GitHub Release tagged `latest` (wget-able)
#
# Artifacts include compiled dist/, dist-server/, production node_modules/,
# public/, shared/, server/ — everything `node dist-server/server/index.js`
# needs to run.
#
# Trigger: push to xxj_main, or manual run from the Actions tab.

name: Build Linux tarball

on:
  push:
    branches: [xxj_main]
  workflow_dispatch:

concurrency:
  group: tarball-${{ github.ref }}
  cancel-in-progress: true

# softprops/action-gh-release needs contents: write to create/update
# the rolling `latest` release. New repos default GITHUB_TOKEN to read-only,
# which causes a silent 404 on the release API.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          # Pull better-sqlite3's prebuilt linux-x64 binary from the China
          # mirror so we don't fall back to compiling from source.
          npm_config_better_sqlite3_binary_host_mirror: "https://registry.npmmirror.com/-/binary/better-sqlite3"
        run: npm install --no-audit --no-fund

      - name: Build client and server
        run: npm run build

      - name: Strip devDependencies
        run: npm prune --omit=dev

      - name: Trim node_modules cruft
        run: |
          # Strip documentation, tests, and other build-time-only files from
          # node_modules. Saves ~80-100MB on this project's dep tree. None
          # of these are needed at runtime.
          find node_modules -type f \( \
            -name '*.md' -o \
            -name '*.markdown' -o \
            -name '*.ts' -o \
            -name '*.d.ts' -o \
            -name '*.map' -o \
            -name '*.tsx' -o \
            -name 'LICENSE*' -o \
            -name 'CHANGELOG*' \
          \) -delete 2>/dev/null || true
          find node_modules -type d \( \
            -name 'test' -o \
            -name 'tests' -o \
            -name '__tests__' -o \
            -name '__mocks__' -o \
            -name 'docs' -o \
            -name 'doc' -o \
            -name 'examples' -o \
            -name 'example' \
          \) -exec rm -rf {} + 2>/dev/null || true
          # Keep TypeScript source maps for our own dist-server (debugging),
          # so don't touch dist-server/*.map.
          echo "After trim: $(du -sh node_modules | cut -f1)"

      - name: Stage runtime files
        run: |
          # Build a clean staging dir so the tarball has a single top-level
          # `cloudcli/` directory — extraction yields /home/xxjwulu/cloudcli,
          # not a mess of files dumped into the parent.
          STAGE="$RUNNER_TEMP/cloudcli"
          mkdir -p "$STAGE"

          # Runtime-essential trees. Keep paths identical to the source repo
          # so @/ alias resolution inside dist-server/ still works.
          cp -r dist dist-server public shared server package.json "$STAGE/"
          cp -r node_modules "$STAGE/node_modules"

      - name: Pack tarball + sha256
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          TARNAME="cloudcli-${VERSION}-${SHORT_SHA}-linux-x64.tar.gz"

          cd "$RUNNER_TEMP"
          tar -czf "$TARNAME" cloudcli/
          sha256sum "$TARNAME" > "$TARNAME.sha256"

          ls -lh "$TARNAME"
          echo "tarname=$TARNAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudcli-linux-x64
          path: |
            ${{ runner.temp }}/${{ steps.pack.outputs.tarname }}
            ${{ runner.temp }}/${{ steps.pack.outputs.tarname }}.sha256
          retention-days: 90

      - name: Publish to `latest` release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ steps.pack.outputs.short_sha }})
          body: |
            Auto-built from commit ${{ github.sha }}.

            ## Deploy on Aliyun (China-friendly)

            ```bash
            curl -fsSL https://raw.gitcode.com/xxjwulu/claudecodeui/raw/xxj_main/scripts/deploy-on-linux.sh | bash
            ```

            Or from the gitcode mirror (faster in CN):
            ```bash
            wget https://gitcode.com/xxjwulu/claudecodeui/raw/releases/cloudcli-linux-x64.tar.gz
            ```

            ## Deploy manually (GitHub releases, slow in CN)

            ```bash
            wget https://github.com/xxjwulu/claudecodeui/releases/download/latest/${{ steps.pack.outputs.tarname }}
            tar -xzf ${{ steps.pack.outputs.tarname }} -C $HOME
            cd $HOME/cloudcli
            node dist-server/server/index.js
            ```
          files: |
            ${{ runner.temp }}/${{ steps.pack.outputs.tarname }}
            ${{ runner.temp }}/${{ steps.pack.outputs.tarname }}.sha256
          prerelease: true

      # Upload the same tarball to gitcode via GitLab's Generic Packages API.
      # Previous approach used `git push --force` to an orphan branch, but
      # git's smart HTTP protocol funnels 260MB into a single pack stream
      # that takes 10+ minutes (or stalls) from a US Actions runner to CN.
      # HTTP PUT to the package registry uses chunked transfer with no git
      # overhead, completes in ~2-3 minutes, and doesn't pollute the repo
      # with orphan branches or bloated history.
      - name: Sync tarball to gitcode (China mirror, GitLab package API)
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "::warning::GITCODE_TOKEN secret is empty — skipping gitcode sync."
            exit 0
          fi

          # URL-encode the project path (xxjwulu/claudecodeui → xxjwulu%2Fclaudecodeui)
          # for use in the API path.
          PROJECT_ID=$(printf '%s' "xxjwulu/claudecodeui" | sed 's,/,%%2F,g')
          API="https://gitcode.com/api/v4/projects/${PROJECT_ID}"

          TAR="$RUNNER_TEMP/${{ steps.pack.outputs.tarname }}"
          SHA="$RUNNER_TEMP/${{ steps.pack.outputs.tarname }}.sha256"
          SIZE=$(stat -c%s "$TAR")
          echo "Uploading $SIZE bytes to gitcode Generic Packages API ..."

          # Upload the tarball. The URL is:
          #   PUT /projects/:id/packages/generic/<pkg>/<version>/<filename>
          # Re-uploading to the same version overwrites the previous file.
          HTTP_CODE=$(
            curl --silent --show-error --write-out '%{http_code}' --output /tmp/upload-resp.txt \
              --request PUT \
              --header "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$TAR" \
              "$API/packages/generic/cloudcli/latest/cloudcli-linux-x64.tar.gz" \
              | tail -1
          )
          echo "Upload HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "Upload failed. Response body:"
            cat /tmp/upload-resp.txt || true
            exit 1
          fi

          # Upload the sha256 alongside so the deploy script can verify.
          curl --silent --show-error --fail \
            --request PUT \
            --header "PRIVATE-TOKEN: $GITCODE_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$SHA" \
            "$API/packages/generic/cloudcli/latest/cloudcli-linux-x64.tar.gz.sha256" \
            > /dev/null

          echo "Upload complete."
          echo "Download URL (auth required for private projects):"
          echo "  $API/packages/generic/cloudcli/latest/cloudcli-linux-x64.tar.gz"
